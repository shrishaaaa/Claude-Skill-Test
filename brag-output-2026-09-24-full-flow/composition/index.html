<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-400.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-500.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-600.ttf") format("truetype");
        font-weight: 600;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f6f8;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #f5f6f8;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      .scene {
        background: #f5f6f8;
      }
      .inner {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .shot {
        position: absolute;
        display: block;
        left: 0px;
        top: 61px;
        width: 1920px;
        height: 958px;
      }
      /* Per-scene overlay layers (cursor / glow / ripple) live INSIDE that
         scene's .inner wrapper (see build script) so they scale and pan
         together with the zoom — this is the fix for the prior cut's
         cursor-drifts-off-the-button bug. */
      .cursor {
        position: absolute;
        width: 30px;
        height: 34px;
        left: 0;
        top: 0;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
      }
      .glow {
        position: absolute;
        left: 0;
        top: 0;
        width: 10px;
        height: 10px;
        border-radius: 10px;
        background: rgba(37, 99, 235, 0.16);
        box-shadow: 0 0 0 1.5px rgba(37, 99, 235, 0.35) inset;
        opacity: 0;
        pointer-events: none;
        z-index: 40;
      }
      .ripple {
        position: absolute;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        margin-top: -7px;
        border-radius: 9999px;
        border: 2px solid rgba(37, 99, 235, 0.55);
        opacity: 0;
        pointer-events: none;
        z-index: 41;
      }
      .type-cover {
        position: absolute;
        left: 0;
        top: 0;
        background: #ffffff;
        z-index: 20;
      }
      .type-text {
        position: absolute;
        left: 0;
        top: 0;
        color: #111827;
        white-space: pre;
        z-index: 21;
      }
      .type-caret {
        position: absolute;
        left: 0;
        top: 0;
        width: 2px;
        background: #111827;
        z-index: 22;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="brag"
      data-start="0"
      data-duration="60.25"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <!--
        17 real screenshots (1920x958, scale 1.0, letterboxed 61px top/bottom
        -> canvasY = origY + 61, canvasX = origX). Every scene is self
        contained: its own .inner wrapper carries the <img> AND that scene's
        own cursor/glow/ripple/type-overlay DOM, built once at document.fonts
        .ready time (see build script). Zoom (scale/x/y on .inner) always
        completes before that beat's cursor/click/type begins.
      -->
      <section id="sc1" class="clip scene" data-start="0.00" data-duration="3.30" data-track-index="0">
        <div class="inner" id="sc1-inner"><img class="shot" src="assets/screens/s1.png" /></div>
      </section>

      </section>
      <section id="sc12" class="clip scene" data-start="37.27" data-duration="3.20" data-track-index="0">

      </section>
      <section id="sc13" class="clip scene" data-start="40.47" data-duration="3.15" data-track-index="0">
        <div class="inner" id="sc13-inner" style="opacity:0;"><img class="shot" src="assets/screens/s13.png" /></div>
      </section>
      <section id="sc14" class="clip scene" data-start="43.62" data-duration="3.05" data-track-index="0">
        <div class="inner" id="sc14-inner" style="opacity:0;"><img class="shot" src="assets/screens/s14.png" /></div>
      </section>
      <section id="sc15" class="clip scene" data-start="46.67" data-duration="3.84" data-track-index="0">
        <div class="inner" id="sc15-inner" style="opacity:0;"><img class="shot" src="assets/screens/s15.png" /></div>
      </section>
      <section id="sc16" class="clip scene" data-start="50.51" data-duration="3.10" data-track-index="0">
        <div class="inner" id="sc16-inner" style="opacity:0;"><img class="shot" src="assets/screens/s16.png" /></div>
      </section>
      <section id="sc17" class="clip scene" data-start="53.61" data-duration="2.85" data-track-index="0">
        <div class="inner" id="sc17-inner" style="opacity:0;"><img class="shot" src="assets/screens/s17.png" /></div>
      </section>
      <section id="sc18" class="clip scene" data-start="56.46" data-duration="3.75" data-track-index="0">
        <div class="inner" id="sc18-inner" style="opacity:0;"><img class="shot" src="assets/screens/s18.png" /></div>
      </section>

      <script>
       document.fonts.ready.then(function () {
        var tl = gsap.timeline({ paused: true });

        // ---------------------------------------------------------------
        // Build a per-scene overlay set (cursor/glow/ripple) as CHILDREN of
        // that scene's .inner wrapper. This is the structural fix: when the
        // wrapper scales/pans for a zoom, these overlays move with it and
        // stay pixel-locked to the real UI element underneath.
        // ---------------------------------------------------------------
        function buildOverlays(sceneId) {
          var inner = document.getElementById(sceneId + "-inner");
          var cursor = document.createElementNS(null, "div");
          var svgNS = "http://www.w3.org/2000/svg";
          var cursorSvg = document.createElementNS(svgNS, "svg");
          cursorSvg.setAttribute("viewBox", "0 0 24 26");
          cursorSvg.setAttribute("class", "cursor");
          cursorSvg.id = sceneId + "-cursor";
          var path = document.createElementNS(svgNS, "path");
          path.setAttribute(
            "d",
            "M2 1.5 L2 20.5 L7.2 16.3 L10.4 23.4 L13.2 22.1 L10.1 15.1 L16.8 14.6 Z",
          );
          path.setAttribute("fill", "#ffffff");
          path.setAttribute("stroke", "#1f2937");
          path.setAttribute("stroke-width", "1.4");
          path.setAttribute("stroke-linejoin", "round");
          cursorSvg.appendChild(path);

          var glow = document.createElement("div");
          glow.className = "glow";
          glow.id = sceneId + "-glow";

          var ripple = document.createElement("div");
          ripple.className = "ripple";
          ripple.id = sceneId + "-ripple";

          inner.appendChild(glow);
          inner.appendChild(ripple);
          inner.appendChild(cursorSvg);
        }
        [
          "sc1", "sc2", "sc3", "sc4", "sc5", "sc6", "sc8", "sc9", "sc10",
          "sc11", "sc12", "sc13", "sc14", "sc15", "sc16", "sc17", "sc18",
        ].forEach(buildOverlays);

        // ---------------------------------------------------------------
        // Measured real-UI points, ORIGINAL screenshot px -> canvas px
        // (canvasX = origX, canvasY = origY + 61; screenshots are 1920x958,
        // scale 1.0, letterboxed 61px top/bottom).
        // ---------------------------------------------------------------
        function pt(x, y) {
          return { x: x, y: y + 61 };
        }
        function box(x0, y0, x1, y1) {
          return { tl: pt(x0, y0), br: pt(x1, y1), cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 + 61 };
        }

        var T = {
          sendBtn: box(1760, 77, 1894, 99),
          vendorField: box(761, 461, 1158, 494),
          searchBox: box(760, 510, 1159, 544),
          firstItem: box(760, 555, 1159, 579),
          assessmentField: box(761, 500, 1158, 534),
          nextBtn: box(1095, 556, 1158, 591),
          contactsField: box(649, 376, 1270, 409),
          dueDateField6: box(649, 531, 1270, 565),
          templateField6: box(649, 636, 1270, 670),
          sendToVendorBtn: box(1108, 797 - 61, 1270, 832 - 61), // corrected below
          completeBtn: box(850, 496, 1159, 529),
          fullnameField: box(648, 406, 1271, 434),
          emailField: box(648, 490, 1271, 519),
          startBtn: box(648, 598, 1271, 645),
          checkEmailMsg: box(850, 321, 1069, 399),
          signinBtn: box(850, 480, 1159, 518),
          yesOption: box(752, 205, 1454, 253),
          commentLink: box(752, 406, 949, 420),
          commentBox: box(1560, 750, 1903, 840),
          commentBtn: box(1824, 855, 1903, 880),
          postedComment: box(1560, 175, 1889, 249),
          doneBtn: box(1091, 500, 1158, 533),
        };
        // sendToVendorBtn was measured directly in canvas-space already (y 736-771 orig);
        // pt() would double-add the +61 offset, so build it explicitly instead.
        T.sendToVendorBtn = { tl: pt(1108, 736), br: pt(1270, 771), cx: (1108 + 1270) / 2, cy: (736 + 771) / 2 + 61 };

        // ---------------------------------------------------------------
        // Reusable per-scene helpers (all selectors scoped by sceneId)
        // ---------------------------------------------------------------
        function cursorTo(scene, time, target, dur, ease) {
          tl.to("#" + scene + "-cursor", { x: target.cx - 3, y: target.cy - 2, opacity: 1, duration: dur, ease: ease || "power2.out" }, time);
        }
        function cursorHide(scene, time, dur) {
          tl.to("#" + scene + "-cursor", { opacity: 0, duration: dur || 0.25 }, time);
        }
        function glowOn(scene, time, target, dur) {
          var w = target.br.x - target.tl.x,
            h = target.br.y - target.tl.y;
          tl.set("#" + scene + "-glow", { left: target.tl.x, top: target.tl.y, width: w, height: h, borderRadius: Math.min(14, h / 2) }, time);
          tl.to("#" + scene + "-glow", { opacity: 1, duration: dur || 0.18 }, time);
        }
        function glowOff(scene, time, dur) {
          tl.to("#" + scene + "-glow", { opacity: 0, duration: dur || 0.2 }, time);
        }
        function pressRipple(scene, time, target) {
          tl.to("#" + scene + "-cursor", { scale: 0.88, duration: 0.09, yoyo: true, repeat: 1 }, time);
          tl.set("#" + scene + "-ripple", { left: target.cx, top: target.cy, scale: 0.3, opacity: 0.85 }, time);
          tl.to("#" + scene + "-ripple", { scale: 2.4, opacity: 0, duration: 0.45, ease: "power2.out" }, time);
        }
        function zoomTo(scene, time, targetScale, target, dur, ease) {
          var k = 1.3;
          var vx = (960 - target.cx) * (targetScale - 1) * k;
          var vy = (540 - target.cy) * (targetScale - 1) * k;
          tl.to("#" + scene + "-inner", { scale: targetScale, x: vx, y: vy, duration: dur, ease: ease || "power2.inOut" }, time);
        }

        // "Zoom completes, THEN the cursor appears in place and clicks" —
        // one interaction beat. Returns the time the beat finishes.
        function zoomThenClick(scene, t, targetScale, target, zoomDur) {
          zoomTo(scene, t, targetScale, target, zoomDur || 0.85);
          var afterZoom = t + (zoomDur || 0.85) + 0.15;
          cursorTo(scene, afterZoom, target, 0.25);
          var hoverAt = afterZoom + 0.28;
          glowOn(scene, hoverAt, target, 0.16);
          var clickAt = hoverAt + 0.22;
          pressRipple(scene, clickAt, target);
          glowOff(scene, clickAt + 0.2, 0.2);
          var doneAt = clickAt + 0.45;
          cursorHide(scene, doneAt + 0.15, 0.25);
          return doneAt + 0.4;
        }

        function measureTextWidth(text, fontWeight, fontSizePx) {
          var probe = document.createElement("span");
          probe.style.position = "absolute";
          probe.style.visibility = "hidden";
          probe.style.whiteSpace = "pre";
          probe.style.fontFamily = "Inter, ui-sans-serif, system-ui, sans-serif";
          probe.style.fontWeight = fontWeight;
          probe.style.fontSize = fontSizePx + "px";
          probe.textContent = text;
          document.body.appendChild(probe);
          var w = probe.getBoundingClientRect().width;
          document.body.removeChild(probe);
          return w;
        }
        function typeText(scene, startTime, fullText, coverBox, x0, y0Orig, fontSize, fontWeight, cps) {
          // x0/y0Orig are given in ORIGINAL screenshot px (same space as the
          // measured boxes below), matching every other coordinate in this
          // file — apply the same +61 canvas offset coverBox already gets
          // via box()/pt(), or the typed text lands off the real field
          // (this was the earlier misalignment bug).
          var y0 = y0Orig + 61;
          var id = scene + "-type" + Math.round(startTime * 1000);
          var inner = document.getElementById(scene + "-inner");
          var cover = document.createElement("div");
          cover.className = "type-cover";
          cover.style.left = coverBox.tl.x + "px";
          cover.style.top = coverBox.tl.y + "px";
          cover.style.width = coverBox.br.x - coverBox.tl.x + "px";
          cover.style.height = coverBox.br.y - coverBox.tl.y + "px";
          cover.style.opacity = 0;
          var text = document.createElement("span");
          text.className = "type-text";
          text.style.left = x0 + "px";
          text.style.top = y0 + "px";
          text.style.fontSize = fontSize + "px";
          text.style.fontWeight = fontWeight;
          text.style.opacity = 0;
          var caret = document.createElement("div");
          caret.className = "type-caret";
          caret.style.left = x0 + "px";
          caret.style.top = y0 + 1 + "px";
          caret.style.height = fontSize * 1.15 + "px";
          caret.style.opacity = 0;
          inner.appendChild(cover);
          inner.appendChild(text);
          inner.appendChild(caret);

          var dur = fullText.length / cps;
          var fullWidth = measureTextWidth(fullText, fontWeight, fontSize);
          tl.to(cover, { opacity: 1, duration: 0.01 }, startTime);
          tl.to(text, { opacity: 1, duration: 0.01 }, startTime);
          tl.to(caret, { opacity: 1, duration: 0.01 }, startTime);
          var driver = { n: 0 };
          tl.to(
            driver,
            {
              n: fullText.length,
              duration: dur,
              ease: "none",
              onUpdate: function () {
                var frac = fullText.length ? driver.n / fullText.length : 0;
                text.textContent = fullText.substring(0, Math.floor(driver.n));
                caret.style.left = x0 + fullWidth * frac + 2 + "px";
              },
            },
            startTime,
          );
          var blink = { p: 0 };
          tl.to(
            blink,
            {
              p: Math.PI * 2 * Math.max(1, Math.round(dur / 0.5)),
              duration: dur,
              ease: "none",
              onUpdate: function () {
                caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
              },
            },
            startTime,
          );
          return startTime + dur;
        }

        // Zoom completes, THEN cursor appears + clicks the field, THEN types.
        function zoomThenType(scene, t, targetScale, target, text, coverBox, x0, y0, fontSize, cps, zoomDur) {
          zoomTo(scene, t, targetScale, target, zoomDur || 0.85);
          var afterZoom = t + (zoomDur || 0.85) + 0.15;
          cursorTo(scene, afterZoom, target, 0.25);
          var hoverAt = afterZoom + 0.28;
          glowOn(scene, hoverAt, target, 0.16);
          var clickAt = hoverAt + 0.22;
          pressRipple(scene, clickAt, target);
          glowOff(scene, clickAt + 0.2, 0.2);
          var typeStart = clickAt + 0.35;
          var typeEnd = typeText(scene, typeStart, text, coverBox, x0, y0, fontSize, 400, cps);
          cursorHide(scene, typeEnd + 0.2, 0.25);
          return typeEnd + 0.45;
        }

        function fadeIn(scene, time, dur, fromScale) {
          if (fromScale) {
            tl.fromTo("#" + scene + "-inner", { opacity: 0, scale: fromScale }, { opacity: 1, scale: 1, duration: dur, ease: "power2.out" }, time);
          } else {
            tl.fromTo("#" + scene + "-inner", { opacity: 0 }, { opacity: 1, duration: dur }, time);
          }
        }
        function fadeOut(scene, time, dur) {
          tl.to("#" + scene + "-inner", { opacity: 0, duration: dur }, time);
        }

        // =================================================================
        // SCENE-BY-SCENE TIMELINE
        // =================================================================
        var t = 0;

        // --- sc1: Dashboard -> click "Send questionnaire" ---
        var sc1Start = t;
        fadeIn("sc1", t, 0.25);
        t += 0.6;
        t = zoomThenClick("sc1", t, 1.18, T.sendBtn);
        fadeOut("sc1", t, 0.35);
        t += 0.35;

        // --- sc2: Send questionnaire modal, vendor dropdown (empty) ---
        var sc2Start = t;
        fadeIn("sc2", t, 0.3, 1.05);
        t += 0.45;
        t = zoomThenClick("sc2", t, 1.2, T.vendorField);
        fadeOut("sc2", t, 0.3);
        t += 0.3;

        // --- sc3: Vendor search dropdown open -> click first result ---
        var sc3Start = t;
        fadeIn("sc3", t, 0.3, 1.1);
        tl.set("#sc3-inner", { scale: 1.2, x: (960 - T.searchBox.cx) * 0.2 * 1.3, y: (540 - T.searchBox.cy) * 0.2 * 1.3 }, t);
        t += 0.35;
        t = zoomThenClick("sc3", t, 1.2, T.firstItem, 0.5);
        fadeOut("sc3", t, 0.3);
        t += 0.3;

        // --- sc4: Vendor + assessment selected -> click Next ---
        var sc4Start = t;
        fadeIn("sc4", t, 0.3, 1.1);
        t += 0.45;
        t = zoomThenClick("sc4", t, 1.18, T.nextBtn);
        fadeOut("sc4", t, 0.3);
        t += 0.3;

        // --- sc5: Contacts/due date/template form, empty -> type email ---
        var sc5Start = t;
        fadeIn("sc5", t, 0.3, 1.06);
        t += 0.4;
        t = zoomThenType(
          "sc5", t, 1.2, T.contactsField,
          "shrisha.tuladhar@securitypalhq.com",
          box(660, 380, 1000, 405), 665, 383, 16, 42,
        );
        fadeOut("sc5", t, 0.3);
        t += 0.3;

        // --- sc6: Form filled -> due date -> template -> Send to vendor ---
        var sc6Start = t;
        fadeIn("sc6", t, 0.3, 1.1);
        t += 0.4;
        // due date: brief settle-zoom, no click (already filled)
        zoomTo("sc6", t, 1.15, T.dueDateField6, 0.8);
        t += 0.8 + 0.35;
        // template: pan over, no click
        zoomTo("sc6", t, 1.15, T.templateField6, 0.7);
        t += 0.7 + 0.3;
        // send to vendor: full zoom + click
        t = zoomThenClick("sc6", t, 1.22, T.sendToVendorBtn, 0.75);
        fadeOut("sc6", t, 0.35);
        t += 0.35;

        // --- sc8: Gmail questionnaire email -> click Complete Questionnaire ---
        var sc8Start = t;
        fadeIn("sc8", t, 0.3, 1.04);
        t += 0.55;
        t = zoomThenClick("sc8", t, 1.18, T.completeBtn);
        fadeOut("sc8", t, 0.35);
        t += 0.35;

        // --- sc9: Invitation, empty -> type name -> type email ---
        var sc9Start = t;
        fadeIn("sc9", t, 0.3, 1.05);
        t += 0.5;
        t = zoomThenType(
          "sc9", t, 1.2, T.fullnameField,
          "Shrisha Tuladhar",
          box(660, 410, 1000, 432), 663, 412, 17, 40,
        );
        t += 0.2;
        t = zoomThenType(
          "sc9", t, 1.2, T.emailField,
          "shrisha.tuladhar@securitypalhq.com",
          box(660, 494, 1050, 516), 663, 496, 17, 42,
        );
        fadeOut("sc9", t, 0.3);
        t += 0.3;

        // --- sc10: Invitation filled -> click Start questionnaire ---
        var sc10Start = t;
        fadeIn("sc10", t, 0.3, 1.06);
        t += 0.35;
        t = zoomThenClick("sc10", t, 1.15, T.startBtn);
        fadeOut("sc10", t, 0.35);
        t += 0.35;

        // --- sc11: Check your email — hold + gentle zoom ---
        var sc11Start = t;
        fadeIn("sc11", t, 0.35, 1.05);
        t += 0.7;
        zoomTo("sc11", t, 1.12, T.checkEmailMsg, 1.1);
        t += 1.1 + 0.9;
        fadeOut("sc11", t, 0.35);
        t += 0.35;

        // --- sc12: Gmail sign-in email -> click Sign in to Vendor Portal ---
        var sc12Start = t;
        fadeIn("sc12", t, 0.3, 1.04);
        t += 0.5;
        t = zoomThenClick("sc12", t, 1.18, T.signinBtn);
        fadeOut("sc12", t, 0.35);
        t += 0.35;

        // --- sc13: Answer Q1, unanswered -> click Yes ---
        var sc13Start = t;
        fadeIn("sc13", t, 0.3, 1.05);
        t += 0.5;
        t = zoomThenClick("sc13", t, 1.15, T.yesOption);
        fadeOut("sc13", t, 0.3);
        t += 0.3;

        // --- sc14: Q1 answered -> click "Comment on this question" ---
        var sc14Start = t;
        fadeIn("sc14", t, 0.3, 1.04);
        t += 0.4;
        t = zoomThenClick("sc14", t, 1.15, T.commentLink);
        fadeOut("sc14", t, 0.3);
        t += 0.3;

        // --- sc15: Comments panel, empty -> type a comment ---
        var sc15Start = t;
        fadeIn("sc15", t, 0.3, 1.06);
        t += 0.4;
        t = zoomThenType(
          "sc15", t, 1.25, T.commentBox,
          "Can you confirm this is correct?",
          box(1568, 758, 1900, 800), 1572, 760, 15, 38,
        );
        fadeOut("sc15", t, 0.3);
        t += 0.3;

        // --- sc16: Comment typed, button active -> click Comment ---
        var sc16Start = t;
        fadeIn("sc16", t, 0.3, 1.1);
        t += 0.4;
        t = zoomThenClick("sc16", t, 1.2, T.commentBtn);
        fadeOut("sc16", t, 0.35);
        t += 0.35;

        // --- sc17: Comment posted — hold ---
        var sc17Start = t;
        fadeIn("sc17", t, 0.35, 1.08);
        t += 0.6;
        zoomTo("sc17", t, 1.12, T.postedComment, 0.9);
        t += 0.9 + 1.0;
        fadeOut("sc17", t, 0.35);
        t += 0.35;

        // --- sc18: Completion — zoom out to modal, click Done, settle ---
        var sc18Start = t;
        fadeIn("sc18", t, 0.4, 1.08);
        t += 0.8;
        t = zoomThenClick("sc18", t, 1.15, T.doneBtn);
        t += 0.6; // final settle hold

        // Root duration must cover the final computed time, with a hair of buffer.

        window.__timelines["brag"] = tl;
        tl.seek(0);
       });
      </script>
    </div>
