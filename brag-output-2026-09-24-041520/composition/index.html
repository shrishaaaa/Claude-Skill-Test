  <head>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d12;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #0b0d12;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      /* IMPORTANT: .scene has no background of its own. Each scene is a
         full-frame layer stacked on top of the ones before it; if it painted
         an opaque color here, that color would fully hide the scene beneath
         the instant this one's clip window began — regardless of how
         transparent its own .inner fade-in still was — which is exactly what
         caused the harsh flash in an earlier cut (white first, then black
         once this comment's color was retried). Leaving it transparent lets
         the cross-dissolve genuinely blend the two real images together. */
      .inner {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Real screenshots are 1920x958; the canvas is 1920x1080. Rather than
         padding the extra 122px with letterbox bars (flat or blurred — both
         read as "added space" that isn't the real product), the shot is
         scaled up uniformly (by 1080/958) until it fully covers the frame,
         then cropped evenly left/right by the overflow — centered, so the
         real picture sits in the middle of the frame like the rest of the
         edit. No synthetic pixels are added, every visible pixel is the real
         screenshot, just full-bleed. */
      .shot {
        position: absolute;
        display: block;
        left: -122.255px;
        top: 0;
        width: 2164.509px;
        height: 1080px;
      }
      /* The dashboard's "Send questionnaire" button sits close enough to the
         right edge that a centered crop would clip most of it — nudge this
         one scene's crop right just enough to keep it in view. */
      #sc1 .shot {
        left: -229.962px;
      }
      /* Per-scene overlay layers (cursor / glow / ripple / type overlay)
         live INSIDE that scene's .inner wrapper so they scale and pan
         together with the zoom and stay pixel-locked to the real UI. */
      .cursor {
        position: absolute;
        width: 30px;
        height: 34px;
        left: 0;
        top: 0;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
      }
      .glow {
        position: absolute;
        left: 0;
        top: 0;
        width: 10px;
        height: 10px;
        border-radius: 10px;
        background: rgba(11, 95, 255, 0.16);
        box-shadow: 0 0 0 1.5px rgba(11, 95, 255, 0.35) inset;
        opacity: 0;
        pointer-events: none;
        z-index: 40;
      }
      .ripple {
        position: absolute;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        margin-top: -7px;
        border-radius: 9999px;
        border: 2px solid rgba(11, 95, 255, 0.55);
        opacity: 0;
        pointer-events: none;
        z-index: 41;
      }
      .type-cover {
        position: absolute;
        left: 0;
        top: 0;
        background: #ffffff;
        z-index: 20;
      }
      .type-text {
        position: absolute;
        left: 0;
        top: 0;
        color: #111827;
        white-space: pre;
        z-index: 21;
      }
      .type-caret {
        position: absolute;
        left: 0;
        top: 0;
        width: 2px;
        background: #111827;
        z-index: 22;
      }
      /* Feature-card label chip — sits at the scene level (sibling of
         .inner) so it never zooms/pans with the screenshot. */
      .label-chip {
        position: absolute;
        left: 72px;
        top: 872px;
        max-width: 620px;
        background: #ffffff;
        border-radius: 14px;
        padding: 20px 26px;
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.18);
        z-index: 60;
        opacity: 0;
      }
      .label-chip .accent {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #0b5fff;
        margin-right: 10px;
      }
      .label-chip .title {
        font-size: 26px;
        font-weight: 600;
        color: #111827;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
      }
      .label-chip .sub {
        font-size: 17px;
        color: #525762;
        margin-top: 6px;
        margin-left: 18px;
      }
      .outro-card {
        display: inline-block;
        background: #ffffff;
        border-radius: 18px;
        padding: 28px 44px;
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.18);
      }
    </style>

      <audio id="sfx-key-email-2" src="assets/sfx/keyboard/keypress-006.wav" data-start="13.04" data-track-index="109" data-volume="0.5"></audio>
      <audio id="sfx-key-email-3" src="assets/sfx/keyboard/keypress-008.wav" data-start="13.31" data-track-index="110" data-volume="0.5"></audio>

      <audio id="sfx-click-start-q" src="assets/sfx/interface/click_003.ogg" data-start="14.959" data-track-index="111" data-volume="0.75"></audio>

      <audio id="sfx-click-yes" src="assets/sfx/ui/click1.ogg" data-start="17.089" data-track-index="112" data-volume="0.75"></audio>

      <script>
        document.fonts.ready.then(function () {
          var tl = gsap.timeline({ paused: true });

          // ---------------------------------------------------------------
          // Overlay builders — cursor/glow/ripple are CHILDREN of that
          // scene's .inner wrapper so they move with its zoom/pan and stay
          // pixel-locked to the real UI element underneath.
          // ---------------------------------------------------------------
          function buildOverlays(sceneId) {
            var inner = document.getElementById(sceneId + "-inner");
            var svgNS = "http://www.w3.org/2000/svg";
            var cursorSvg = document.createElementNS(svgNS, "svg");
            cursorSvg.setAttribute("viewBox", "0 0 24 26");
            cursorSvg.setAttribute("class", "cursor");
            cursorSvg.id = sceneId + "-cursor";
            var path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", "M2 1.5 L2 20.5 L7.2 16.3 L10.4 23.4 L13.2 22.1 L10.1 15.1 L16.8 14.6 Z");
            path.setAttribute("fill", "#ffffff");
            path.setAttribute("stroke", "#1f2937");
            path.setAttribute("stroke-width", "1.4");
            path.setAttribute("stroke-linejoin", "round");
            cursorSvg.appendChild(path);

            var glow = document.createElement("div");
            glow.className = "glow";
            glow.id = sceneId + "-glow";

            var ripple = document.createElement("div");
            ripple.className = "ripple";
            ripple.id = sceneId + "-ripple";

            inner.appendChild(glow);
            inner.appendChild(ripple);
            inner.appendChild(cursorSvg);
          }
          ["sc1", "sc2a", "sc2b", "sc3a", "sc3b", "sc4", "sc5"].forEach(buildOverlays);

          // ---------------------------------------------------------------
          // Measured real-UI points, ORIGINAL screenshot px -> canvas px.
          // Screenshots are 1920x958, displayed via the full-bleed cover-fit
          // .shot CSS above: scaled by SCALE = 1080/958 until height fills
          // the canvas, then the overflow width is cropped evenly off both
          // sides (centered) — see .shot { left, width }. This mapping MUST
          // match those CSS numbers exactly. sc1 crops with a different
          // (rightward) shift to keep its button in frame — see SHIFT_SC1
          // and the #sc1 .shot CSS override above.
          // ---------------------------------------------------------------
          var SCALE = 1080 / 958;
          var SHIFT_CENTER = (1920 * SCALE - 1920) / 2; // = 122.255, matches the base .shot left above
          var SHIFT_SC1 = 229.962; // matches #sc1 .shot left above
          function pt(x, y, shift) {
            return { x: x * SCALE - (shift === undefined ? SHIFT_CENTER : shift), y: y * SCALE };
          }
          function box(x0, y0, x1, y1, shift) {
            var a = pt(x0, y0, shift),
              b = pt(x1, y1, shift);
            return { tl: a, br: b, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
          }

          var T = {
            sendBtn: box(1760, 77, 1894, 99, SHIFT_SC1),
            contactsField: box(649, 376, 1270, 409),
            sendToVendorBtn: box(1108, 736, 1270, 771),
            completeBtn: box(850, 496, 1159, 529),
            fullnameField: box(648, 406, 1271, 434),
            emailField: box(648, 490, 1271, 519),
            startBtn: box(648, 598, 1271, 645),
            yesOption: box(752, 205, 1454, 253),
          };

          // ---------------------------------------------------------------
          // Reusable per-scene helpers (all selectors scoped by sceneId).
          // Tuned tighter than a full walkthrough cut for an app-store-paced
          // short edit: zoom completes, THEN cursor/click/type happens.
          // Every zoomTo targetScale below is relative to the .inner
          // identity state, which already shows the full-bleed cover-fit
          // image — so 1.0 is "at rest", never below it (that would reveal
          // empty canvas at the edges).
          // ---------------------------------------------------------------
          function cursorTo(scene, time, target, dur) {
            tl.to("#" + scene + "-cursor", { x: target.cx - 3, y: target.cy - 2, opacity: 1, duration: dur, ease: "power2.out" }, time);
          }
          function cursorHide(scene, time, dur) {
            tl.to("#" + scene + "-cursor", { opacity: 0, duration: dur }, time);
          }
          function glowOn(scene, time, target, dur) {
            var w = target.br.x - target.tl.x,
              h = target.br.y - target.tl.y;
            tl.set("#" + scene + "-glow", { left: target.tl.x, top: target.tl.y, width: w, height: h, borderRadius: Math.min(14, h / 2) }, time);
            tl.to("#" + scene + "-glow", { opacity: 1, duration: dur }, time);
          }
          function glowOff(scene, time, dur) {
            tl.to("#" + scene + "-glow", { opacity: 0, duration: dur }, time);
          }
          function pressRipple(scene, time, target) {
            tl.to("#" + scene + "-cursor", { scale: 0.88, duration: 0.09, yoyo: true, repeat: 1 }, time);
            tl.set("#" + scene + "-ripple", { left: target.cx, top: target.cy, scale: 0.3, opacity: 0.85 }, time);
            tl.to("#" + scene + "-ripple", { scale: 2.4, opacity: 0, duration: 0.4, ease: "power2.out" }, time);
          }
          function zoomTo(scene, time, targetScale, target, dur) {
            var k = 1.3;
            var vx = (960 - target.cx) * (targetScale - 1) * k;
            var vy = (540 - target.cy) * (targetScale - 1) * k;
            tl.to("#" + scene + "-inner", { scale: targetScale, x: vx, y: vy, duration: dur, ease: "power2.inOut" }, time);
          }

          // Timing constants — mirrored exactly from the plan's offline
          // timing pass so section data-start/data-duration above line up
          // with what this script actually produces.
          var Z1 = 0.08,
            CURSOR_DUR = 0.18,
            HOVER_WAIT = 0.16,
            PRECLICK = 0.14,
            GLOWOFF_DELAY = 0.15,
            GLOWOFF_DUR = 0.15,
            POSTCLICK = 0.3,
            HIDE_DELAY = 0.1,
            HIDE_DUR = 0.18,
            TAIL = 0.25;
          var TYPE_CLICK_GAP = 0.22,
            TYPE_HIDE_DELAY = 0.15,
            TYPE_HIDE_DUR = 0.18,
            TYPE_TAIL = 0.3;
          var XFADE = 0.35; // symmetric cross-dissolve between every scene

          // "Zoom completes, THEN the cursor appears in place and clicks."
          // Returns the time the beat finishes.
          function zoomThenClick(scene, t, targetScale, target, zoomDur) {
            zoomTo(scene, t, targetScale, target, zoomDur);
            var afterZoom = t + zoomDur + Z1;
            cursorTo(scene, afterZoom, target, CURSOR_DUR);
            var hoverAt = afterZoom + HOVER_WAIT;
            glowOn(scene, hoverAt, target, 0.12);
            var clickAt = hoverAt + PRECLICK;
            pressRipple(scene, clickAt, target);
            glowOff(scene, clickAt + GLOWOFF_DELAY, GLOWOFF_DUR);
            var doneAt = clickAt + POSTCLICK;
            cursorHide(scene, doneAt + HIDE_DELAY, HIDE_DUR);
            return doneAt + TAIL;
          }

          function measureTextWidth(text, fontWeight, fontSizePx) {
            var probe = document.createElement("span");
            probe.style.position = "absolute";
            probe.style.visibility = "hidden";
            probe.style.whiteSpace = "pre";
            probe.style.fontFamily = "ui-sans-serif, system-ui, sans-serif";
            probe.style.fontWeight = fontWeight;
            probe.style.fontSize = fontSizePx + "px";
            probe.textContent = text;
            document.body.appendChild(probe);
            var w = probe.getBoundingClientRect().width;
            document.body.removeChild(probe);
            return w;
          }
          // x0/y0Orig/fontSize are given in ORIGINAL screenshot px/pt, same
          // as every measured box above — map them through the same
          // SCALE/SHIFT so the fake typed text stays pixel-matched to the
          // real (now full-bleed) field underneath at any zoom level.
          function typeText(scene, startTime, fullText, coverBox, x0Orig, y0Orig, fontSizeOrig, cps) {
            var x0 = x0Orig * SCALE - SHIFT_CENTER;
            var y0 = y0Orig * SCALE;
            var fontSize = fontSizeOrig * SCALE;
            var inner = document.getElementById(scene + "-inner");
            var cover = document.createElement("div");
            cover.className = "type-cover";
            cover.style.left = coverBox.tl.x + "px";
            cover.style.top = coverBox.tl.y + "px";
            cover.style.width = coverBox.br.x - coverBox.tl.x + "px";
            cover.style.height = coverBox.br.y - coverBox.tl.y + "px";
            cover.style.opacity = 0;
            var text = document.createElement("span");
            text.className = "type-text";
            text.style.left = x0 + "px";
            text.style.top = y0 + "px";
            text.style.fontSize = fontSize + "px";
            text.style.fontWeight = 400;
            text.style.opacity = 0;
            var caret = document.createElement("div");
            caret.className = "type-caret";
            caret.style.left = x0 + "px";
            caret.style.top = y0 + 1 + "px";
            caret.style.height = fontSize * 1.15 + "px";
            caret.style.opacity = 0;
            inner.appendChild(cover);
            inner.appendChild(text);
            inner.appendChild(caret);

            var dur = fullText.length / cps;
            var fullWidth = measureTextWidth(fullText, 400, fontSize);
            tl.to(cover, { opacity: 1, duration: 0.01 }, startTime);
            tl.to(text, { opacity: 1, duration: 0.01 }, startTime);
            tl.to(caret, { opacity: 1, duration: 0.01 }, startTime);
            var driver = { n: 0 };
            tl.to(
              driver,
              {
                n: fullText.length,
                duration: dur,
                ease: "none",
                onUpdate: function () {
                  var frac = fullText.length ? driver.n / fullText.length : 0;
                  text.textContent = fullText.substring(0, Math.floor(driver.n));
                  caret.style.left = x0 + fullWidth * frac + 2 + "px";
                },
              },
              startTime,
            );
            var blink = { p: 0 };
            tl.to(
              blink,
              {
                p: Math.PI * 2 * Math.max(1, Math.round(dur / 0.5)),
                duration: dur,
                ease: "none",
                onUpdate: function () {
                  caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
                },
              },
              startTime,
            );
            return startTime + dur;
          }

          // Zoom completes, THEN cursor appears + clicks the field, THEN types.
          function zoomThenType(scene, t, targetScale, target, text, coverBox, x0, y0, fontSize, cps, zoomDur) {
            zoomTo(scene, t, targetScale, target, zoomDur);
            var afterZoom = t + zoomDur + Z1;
            cursorTo(scene, afterZoom, target, CURSOR_DUR);
            var hoverAt = afterZoom + HOVER_WAIT;
            glowOn(scene, hoverAt, target, 0.12);
            var clickAt = hoverAt + PRECLICK;
            pressRipple(scene, clickAt, target);
            glowOff(scene, clickAt + GLOWOFF_DELAY, GLOWOFF_DUR);
            var typeStart = clickAt + TYPE_CLICK_GAP;
            var typeEnd = typeText(scene, typeStart, text, coverBox, x0, y0, fontSize, cps);
            cursorHide(scene, typeEnd + TYPE_HIDE_DELAY, TYPE_HIDE_DUR);
            return typeEnd + TYPE_TAIL;
          }

          // A clean, symmetric cross-dissolve: the outgoing scene fades out
          // while the incoming scene fades in over the SAME window, so
          // there is never a moment where both are more transparent than
          // they should be (the flash an asymmetric fade, or an opaque
          // .scene background, would cause). Three subtle variants rotate
          // across the cut list below so consecutive transitions don't feel
          // identical, while every one stays a plain opacity dissolve at
          // heart — never a wipe, flash, or hard cut:
          //  - "dissolve"   plain cross-fade, no motion.
          //  - "drift-up"   incoming settles down 14->0px as it fades in,
          //                 outgoing drifts up slightly as it fades out.
          //  - "drift-down" the mirror of drift-up.
          //  - "zoom"       incoming settles from 97.5%->100% scale as it
          //                 fades in, outgoing eases up to 102.5%.
          // Every variant returns the incoming scene to the exact identity
          // transform (scale 1, x 0, y 0) by the time the dissolve
          // finishes, so the interaction zoom that follows always starts
          // from a clean baseline.
          function crossfade(outScene, inScene, time, dur, style) {
            style = style || "dissolve";
            if (outScene) {
              tl.to("#" + outScene + "-inner", { opacity: 0, duration: dur, ease: "power1.inOut" }, time);
              if (style === "drift-up") tl.to("#" + outScene + "-inner", { y: -12, duration: dur, ease: "power1.inOut" }, time);
              if (style === "drift-down") tl.to("#" + outScene + "-inner", { y: 12, duration: dur, ease: "power1.inOut" }, time);
              if (style === "zoom") tl.to("#" + outScene + "-inner", { scale: 1.025, duration: dur, ease: "power1.inOut" }, time);
            }
            if (inScene) {
              tl.fromTo("#" + inScene + "-inner", { opacity: 0 }, { opacity: 1, duration: dur, ease: "power1.inOut" }, time);
              if (style === "drift-up") tl.fromTo("#" + inScene + "-inner", { y: 14 }, { y: 0, duration: dur, ease: "power2.out" }, time);
              if (style === "drift-down") tl.fromTo("#" + inScene + "-inner", { y: -14 }, { y: 0, duration: dur, ease: "power2.out" }, time);
              if (style === "zoom") tl.fromTo("#" + inScene + "-inner", { scale: 0.975 }, { scale: 1, duration: dur, ease: "power2.out" }, time);
            }
          }
          function labelInOut(scene, inAt, outAt) {
            var id = "#" + scene + "-label";
            tl.fromTo(id, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, inAt);
            tl.to(id, { opacity: 0, duration: 0.2 }, outAt);
          }

          // =================================================================
          // SCENE-BY-SCENE TIMELINE
          // =================================================================
          var t = 0;

          // --- sc1: Dashboard hook -> click "Send questionnaire" ---
          crossfade(null, "sc1", 0, 0.25);
          t = 0.9;
          t = zoomThenClick("sc1", t, 1.0201, T.sendBtn, 0.55);

          // --- sc2a: Send questionnaire modal, empty -> type vendor email ---
          crossfade("sc1", "sc2a", t, XFADE, "drift-up");
          var sc2aLabelIn = t + XFADE + 0.05;
          t += XFADE + 0.3;
          t = zoomThenType("sc2a", t, 1.0644, T.contactsField, "shrisha.tuladhar@securitypalhq.com", box(660, 380, 1000, 405), 665, 383, 16, 42, 0.5);
          // label only on sc2a — sc2b has none, so there is nothing for it to
          // overlap; fade it out right as the crossfade into sc2b begins.
          labelInOut("sc2a", sc2aLabelIn, t);

          // --- sc2b: Send questionnaire modal, filled -> click "Send to vendor" ---
          // beat-locked: 6.34s (strong_beat, 1.00) — the send payoff
          crossfade("sc2a", "sc2b", t, XFADE, "dissolve");
          t += XFADE - 0.13;
          t = zoomThenClick("sc2b", t, 1.0644, T.sendToVendorBtn, 0.5);

          // --- sc3a: Gmail invite -> click "Complete Questionnaire" ---
          crossfade("sc2b", "sc3a", t, XFADE, "zoom");
          var sc3aLabelIn = t + XFADE + 0.05;
          t += XFADE + 0.4;
          t = zoomThenClick("sc3a", t, 1.0467, T.completeBtn, 0.5);
          // label only on sc3a — sc3b has none, so there is nothing for it to
          // overlap; fade it out right as the crossfade into sc3b begins.
          labelInOut("sc3a", sc3aLabelIn, t);

          // --- sc3b: Vendor invitation -> type name -> type email -> click "Start questionnaire" ---
          // beat-locked: 10.54s (strong_beat, 0.99) — the name field click lands almost exactly on the cue
          crossfade("sc3a", "sc3b", t, XFADE, "drift-down");
          t += XFADE + 0.35;
          t = zoomThenType("sc3b", t, 1.0644, T.fullnameField, "Shrisha Tuladhar", box(660, 410, 1000, 432), 663, 412, 17, 40, 0.5);
          t += 0.15;
          t = zoomThenType("sc3b", t, 1.0644, T.emailField, "shrisha.tuladhar@securitypalhq.com", box(660, 494, 1050, 516), 663, 496, 17, 42, 0.45);
          t += 0.2;
          t = zoomThenClick("sc3b", t, 1.0201, T.startBtn, 0.5);

          // --- sc4: Answer Q1 -> click "Yes" ---
          crossfade("sc3b", "sc4", t, XFADE, "dissolve");
          labelInOut("sc4", t + XFADE + 0.05, t + XFADE + 1.65);
          t += XFADE + 0.35;
          t = zoomThenClick("sc4", t, 1.0201, T.yesOption, 0.5);

          // --- sc5: Completion modal settles -> wordmark + chime ---
          crossfade("sc4", "sc5", t, XFADE, "zoom");
          t += XFADE + 0.5;
          tl.fromTo("#sc5-outro", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.15);

          window.__timelines["brag"] = tl;
          tl.seek(0);
        });
      </script>
    </div>
  </body>
</html>
